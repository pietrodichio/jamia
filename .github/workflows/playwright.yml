name: Playwright E2E Tests

on:
  push:
    branches: [main]

jobs:
  e2e-tests:
    name: E2E Tests (Chromium Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        run: pnpm --filter @jamia/web exec playwright install chromium --with-deps

      - name: Start Supabase
        working-directory: apps/web
        run: |
          npx supabase start
          npx supabase status

      - name: Start NestJS backend
        run: |
          cd apps/backend
          SUPABASE_URL=http://127.0.0.1:54421 \
          SUPABASE_SERVICE_KEY=sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz \
          pnpm run start:dev &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/health && break || sleep 2
          done

      - name: Run Playwright tests
        working-directory: apps/web
        run: pnpm exec playwright test
        env:
          CI: true
          VITE_SUPABASE_URL: http://127.0.0.1:54421
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VITE_API_URL: http://localhost:8080
          VITE_GOOGLE_MAPS_API_KEY: ''

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
